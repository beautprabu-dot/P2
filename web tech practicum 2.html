<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDISPHERE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        /* Top Bright Green Header */
        header {
            background-color: #33ff33;
            text-align: center;
            padding: 25px 10px;
            color: #000000;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        header h2 {
            margin: 5px 0 0 0;
            font-size: 18px;
            font-weight: bold;
        }

        /* Sub-navigation Links */
        nav {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
        }

        nav a {
            color: #777777;
            text-decoration: none;
            margin: 0 15px;
        }

        nav a:hover {
            color: #000000;
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Audio Section */
        .audio-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .audio-section label {
            font-weight: bold;
            font-size: 15px;
        }

        /* Central Medisphere Image */
        .logo-image-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-image-container img {
            width: 380px;
            max-width: 100%;
            height: auto;
            display: inline-block;
        }

        /* Bottom Grid: Left Document Frame & Right Map Placeholder */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .doc-frame {
            border: 1px solid #000;
            height: 250px;
            width: 100%;
            box-sizing: border-box;
        }

        .map-container {
            border: 1px solid #ccc;
            height: 250px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
